name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - name: Benchmark tooling syntax gate
        run: npm run test:bench:syntax
      - run: npm run build
      - name: Cloudflare temporary asset gate
        run: npm run check:temporary-assets
      - run: google-chrome --version
      - run: npm run test:e2e
      - name: Cloudflare deployment readiness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Cloudflare credentials: configured"
          else
            echo "Cloudflare credentials: not configured"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1
