name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Check Cloudflare credentials
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deploy skipped: CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID is not configured."
          fi
      - name: Install dependencies
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm install --no-audit --no-fund
      - name: Build
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm run build
      - name: Deploy
        if: steps.cloudflare.outputs.ready == 'true'
        id: deploy
        shell: bash
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' deploy.log | tail -n 1 || true)
          if [[ -n "$URL" ]]; then
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "### Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Cloudflare deploy completed; inspect Wrangler output for the deployment URL." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Report skipped deployment
        if: steps.cloudflare.outputs.ready != 'true'
        run: echo "### Deployment skipped — add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets." >> "$GITHUB_STEP_SUMMARY"
