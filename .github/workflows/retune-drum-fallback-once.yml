name: Retune drum fallback once

on:
  push:
    branches: [fix/drum-hallucination]
    paths:
      - .github/workflows/retune-drum-fallback-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/drum-hallucination
      - name: Tighten tonal rejection in fallback percussion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/transcribe.js')
          text = path.read_text()
          old = '''      const lowHeavyTransient = lowRatio >= 0.53 && frame.onset >= threshold * 1.45;
      const highZcrTransient = frame.zcr >= 0.15;
      let supported = lowHeavyTransient || highZcrTransient;
      if (!supported) {
        const spectral = drumSpectralEvidence(percussive, frame.start, sampleRate, frameSize);
        const noiseLike = spectral.flatness >= 0.18;
        const strongBroadTransient = spectral.flatness >= 0.08
          && spectral.periodicity <= 0.45
          && frame.onset >= threshold * 1.8;
        supported = noiseLike || strongBroadTransient;
      }
'''
          new = '''      const highZcrTransient = frame.zcr >= 0.15;
      let supported = highZcrTransient;
      if (!supported) {
        const spectral = drumSpectralEvidence(percussive, frame.start, sampleRate, frameSize);
        const lowHeavyTransient = lowRatio >= 0.53
          && frame.onset >= threshold * 1.45
          && spectral.flatness >= 0.035
          && spectral.periodicity <= 0.75;
        const noiseLike = spectral.flatness >= 0.18 && spectral.periodicity <= 0.82;
        const strongBroadTransient = spectral.flatness >= 0.08
          && spectral.periodicity <= 0.45
          && frame.onset >= threshold * 1.8;
        supported = lowHeavyTransient || noiseLike || strongBroadTransient;
      }
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'fallback block: expected 1 match, got {count}')
          path.write_text(text.replace(old, new))
          PY
          node --check src/transcribe.js
          git diff --check
      - name: Commit retune and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/transcribe.js
          git rm .github/workflows/retune-drum-fallback-once.yml
          git commit -m 'tighten spectral gate for fallback drums'
          git push origin HEAD:fix/drum-hallucination
